appId: studio.pixeltoon.desktop
electronDist: node_modules/electron/dist
productName: Pixel & Toon Studio
artifactName: Pixel-Toon-Studio-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: desktop/assets
files:
  - dist/**/*
  - desktop/*.mjs
  - desktop/preload.cjs
  - desktop/assets/icon.ico
  - desktop/assets/icon.png
  - desktop/THIRD_PARTY_NOTICES.md
  - package.json
  - '!node_modules/**/*'
asar: true
mac:
  category: public.app-category.photography
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: desktop/assets/icon.icns
  identity: '-'
  notarize: false
  hardenedRuntime: true
  darkModeSupport: true
  minimumSystemVersion: 13.0.0
  fileAssociations:
    - ext: [png, jpg, jpeg, webp, heic, heif]
      name: 可编辑照片
      role: Editor
      rank: Alternate
  extendInfo:
    CFBundleDisplayName: Pixel & Toon Studio
    NSHumanReadableCopyright: Pixel & Toon Studio
dmg:
  title: Pixel & Toon Studio
  background: desktop/assets/dmg-background.png
  window:
    width: 660
    height: 420
  iconSize: 100
  iconTextSize: 13
  contents:
    - x: 170
      y: 190
      type: file
    - x: 490
      y: 190
      type: link
      path: /Applications
win:
  icon: desktop/assets/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]
  fileAssociations:
    - ext: [png, jpg, jpeg, webp, heic, heif]
      name: Editable Photo
      description: Open with Pixel & Toon Studio
      role: Editor
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Pixel & Toon Studio
portable:
  artifactName: Pixel-Toon-Studio-${version}-win-${arch}-portable.${ext}
npmRebuild: false
